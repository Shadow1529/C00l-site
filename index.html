<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Embed Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        .video-container {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website</h1>
    
    <div class="video-container">
        <!-- Note: YouTube requires the embed format (youtube.com/embed/VIDEO_ID) -->
        <iframe src="https://www.pornhub.com/embed/6adaee9fcb14d" frameborder="0" width="560" height="315" scrolling="no" allowfullscreen></iframe>
    </div>

</body>
</html>
